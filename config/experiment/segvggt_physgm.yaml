# @package _global_
# Stage 2 (iteration 3): per-object PHYSICS on SegVGGT's object queries.
# Usage: python src/main.py +experiment=segvggt_physgm \
#          model.encoder.pretrained_weights=<stage-1 .ckpt or official .pt>
#
# The IGGT physics routes build a per-object token by masked-average-pooling backbone
# patch tokens with the GT instance mask, so they cannot run without ground truth.
# Here the object query *is* the per-object vector: QueryPhysGMReadout decodes
# (mu, var) straight off it, which means physics also works at inference on an unseen
# scene.  The query<->instance correspondence needed for *training* comes from the
# Hungarian match LossSegVGGT already computes for the masks (lambda_phys term).
#
# Default recipe = physics only: everything that existed before is frozen and just the
# fresh readout head trains.  Stage-1 (segvggt_finetune_agnostic) is expected to have
# taught the queries to latch onto objects already; this stage only learns to read
# properties off them.  To co-train segmentation instead, drop `instance_` /
# `semantic_head` from freeze_keywords and raise the loss.segvggt lambda_cls/mask/js
# back to their defaults (0.5 / 1.0 / 0.5).

defaults:
  - /dataset@_group_.manifest: manifest
  - override /model/encoder: segvggt
  - override /loss: [segvggt, segvggt_geo]

wandb:
  name: segvggt_physgm
  tags: [instseg, segvggt, physics, physgm, queries]

logger: tensorboard

data_loader:
  train:
    batch_size: 1

model:
  encoder:
    # REQUIRED: the stage-1 (segvggt_finetune_agnostic) Lightning .ckpt -- its
    # "model." key prefix is stripped automatically by SegVGGTModel.from_checkpoint.
    # The official .pt also loads, but then the queries have never been taught
    # "any object", which is the premise this stage builds on.
    #
    # num_semantic_classes MUST match whatever produced that checkpoint: head width =
    # (num_semantic_classes - len(non_instance_classes)) + 1, and _align_state_dict
    # drops shape-mismatched tensors with only a warning. 200 == stage 1's setting.
    pretrained_weights: output/exp_segvggt_finetune_agnostic/2026-07-28_21-42-50/checkpoints/last.ckpt
    num_semantic_classes: 200
    non_instance_classes: [wall, floor]  # 200 - 2 + 1 = 199-wide instance head
    instance_query_num: 400
    # Attach the per-query physics readout. Null (the default) leaves the branch
    # absent entirely, so this file is the only thing that turns it on.
    phys_scheme: query_physgm
    physgm_hidden: 64
  decoder: null

optimizer:
  # The readout head is randomly initialised (small-init last layer), unlike stage 1
  # where nothing was -- so a hotter LR than stage 1's 2e-5 is appropriate.
  lr: 1.0e-4
  warm_up_steps: 2000
  backbone_lr_multiplier: 1.0
  # Freeze everything pre-existing: DINO + frame/global blocks (incl. their LoRA),
  # the geometry heads, the semantic head (which owns the instance classifier), and
  # the whole object-query machinery. `instance_` covers instance_query_token,
  # instance_cross_blocks, instance_queries_proj and instance_query_self_attn in one
  # keyword, so this stays correct if a query submodule is toggled off in cfg.
  # camera_token / register_token are easy to miss (10240 params, not inside any
  # *_head or *_blocks) but they are prepended to every frame's token sequence and so
  # feed *every* output: left trainable, the physics-only objective would quietly drag
  # them -- and with lambda_mask/js/cls and the geo weight all at 0, nothing would pull
  # back, so this stage's checkpoint would no longer reproduce stage 1's geometry.
  # -> verified: with these 9 keywords, only encoder.query_physgm trains (~0.2M).
  # QueryPhysGMReadout hangs directly off the arch (encoder.query_physgm.*), so no
  # keyword below can reach it by the substring match base_wrapper uses.
  freeze_keywords:
    - patch_embed
    - frame_blocks
    - global_blocks
    - camera_head
    - depth_head
    - semantic_head
    - instance_
    - camera_token
    - register_token

train:
  segvggt_geo_supervision: gt

trainer:
  max_steps: 60000
  val_check_interval: 250
  precision: bf16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 4

checkpointing:
  load: null
  every_n_train_steps: 1000
  save_weights_only: false
  save_top_k: 1

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  segvggt:
    weight: 1.0
    class_agnostic: true
    lambda_phys: 1.0
    phys_mse_weight: 1.0
    # Segmentation terms off: their modules are frozen, so a nonzero lambda would
    # only add gradient traffic that no optimizer step can consume.
    # NOTE: lambda=0 does NOT skip the forward work. LossSegVGGT.forward builds
    # BCE/Dice/JS unconditionally (loss_segvggt.py:361-382) and scales by lambda
    # only at the final sum (:438-442), so this blocks the backward contribution,
    # not the compute. The Hungarian match (:352) stays live regardless -- it is
    # what lambda_phys consumes (:391-400), and short-circuiting it would silently
    # zero the physics term (no error raised, loss just stays flat).
    lambda_cls: 0.0
    lambda_mask: 0.0
    lambda_js: 0.0
  segvggt_geo:
    weight: 0.0   # geometry frozen in this stage

dataset:
  manifest:
    # Same scannet100 subset the IGGT physgm route uses -- these are the scenes that
    # actually carry InstaScene VLM physics annotations.
    root: /mnt/storage_pool/liaoyuanjun/data/InsScene-15K/processed_scannetpp_v2
    manifest_path: /home/liaoyuanjun/projects/AnySplat/manifests/manifest_phys_scannet100.jsonl
    # ScanNet++ iPhone frames are typically ~690x920; crop shim uses input_image_shape.
    original_image_shape: [690, 920]
    # Must match stage 1: it sets the patch grid (252/14 x 448/14 = 18x32), which is
    # the resolution the object queries -- and so this stage's readout -- were shaped at.
    input_image_shape: [252, 448]
    physics_parser: instascene_vlm_physgm
    view_sampler:
      num_context_views: 4
      num_target_views: 0   # SegVGGT: all supervised frames in context only
      max_img_per_gpu: 8
