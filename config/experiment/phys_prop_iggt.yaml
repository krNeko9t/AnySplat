# @package _global_
# IGGT physics property regression on instascene VLM annotations.
# Usage: python src/main.py +experiment=phys_prop_iggt
#
# Scheme = instascene_vlm parser + phys_scheme=property + phys_prop loss.

defaults:
  - /dataset@_group_.manifest: manifest
  - override /model/encoder: iggt
  - override /loss: [phys_prop]

wandb:
  name: phys_prop_iggt
  tags: [physics, property, iggt]

logger: tensorboard

data_loader:
  train:
    batch_size: 1

model:
  encoder:
    pretrained_weights: "/home/liaoyuanjun/iggt_checkpoint.pth"
    instance_feat_dim: 8
    intermediate_layer_idx: [4, 11, 17, 23]
    phys_scheme: property
    phys_feat_dim: 32
    phys_property_hidden: 64
    phys_use_point_feat: true
    phys_use_window_cross_attn: true
  decoder: null

optimizer:
  lr: 3.0e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  freeze_keywords: [aggregator, camera_head, point_head, depth_head, part_adaptor, part_head]
  param_groups:
    # - keywords: [part_adaptor, part_head]
    #   lr_multiplier: 0.1
    - keywords: [physics_scheme]
      lr_multiplier: 1.0
    # - keywords: [point_head, depth_head]
      # lr_multiplier: 0.1

trainer:
  max_steps: 60000
  val_check_interval: 500
  precision: bf16-mixed
  limit_val_batches: 1

checkpointing:
  load: null
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 3

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  phys_prop:
    weight: 1.0
    var_weight: 1.0

dataset:
  manifest:
    root: /mnt/storage_pool/liaoyuanjun/data/InsScene-15K/processed_scannetpp_v2
    manifest_path: /home/liaoyuanjun/projects/AnySplat/manifests/manifest_phys_scannet100.jsonl
    # ScanNet++ iPhone frames are typically ~690x920; crop shim uses input_image_shape.
    original_image_shape: [690, 920]
    physics_parser: instascene_vlm
    view_sampler:
      num_context_views: 4
      num_target_views: 0   # IGGT: all supervised frames in context only
      max_img_per_gpu: 8