# @package _global_
# InstSeg 在 InsScene-15K 完整数据集上多卡训练。
# 先运行 scripts/extract_and_make_manifest_insscene.py 解压并生成 manifest，
# 再本实验用 dataset.custom.root / manifest_path 指向解压目录和 manifest。
# 多卡：CUDA_VISIBLE_DEVICES=0,1,2,3 python src/main.py -m experiment=instseg_insscene15k

defaults:
  - instseg_custom

train:
  video_use_gt_trajectory: true  # val 视频固定轨迹，便于对比训练进度

wandb:
  name: instseg_insscene15k
  tags: [instseg, insscene15k]

# 解压后的根目录与 manifest（请先跑 extract_and_make_manifest_insscene.py）
dataset:
  custom:
    root: /mnt/shared-storage-gpfs2/solution-gpfs02/liaoyuanjun/dataset/InsScene-15K/extracted_insscene
    manifest_path: /mnt/shared-storage-gpfs2/solution-gpfs02/liaoyuanjun/dataset/InsScene-15K/extracted_insscene/manifest.jsonl

# 多卡时适当增加 num_workers
data_loader:
  train:
    num_workers: 8
    batch_size: 6

optimizer:
  # Differential LRs:
  # - instance head: lr
  # - everything else: lr * backbone_lr_multiplier
  lr: 4.0e-4
  warm_up_steps: 3000

trainer:
  max_steps: 60000
  val_check_interval: 200

loss:
  disc:
    weight: 1.0
    delta_v: 0.5          # 可调小到 0.2
    delta_d: 1.5          # 可调大到 2.5
    ignore_id: 0
    # --- 新增开关 ---
    # multi_view: true      # 跨视图 merged disc loss（默认 false）
    # alpha_var: 1.0        # pull 权重（默认 1.0）
    # alpha_dist: 2.0       # push 权重（默认 1.0，可加大）
    # soft_push_weight: 0.5 # continuous exp(-dist) push（默认 0 关闭）
    # soft_pull_weight: 0.1 # continuous mean-dist pull（默认 0 关闭）