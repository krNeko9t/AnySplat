# @package _global_
# IGGT instance segmentation on a manifest dataset.
# Usage: python src/main.py experiment=instseg_iggt

defaults:
  - /dataset@_group_.manifest: manifest
  - override /model/encoder: iggt
  - override /loss: [disc]

wandb:
  name: instseg_iggt
  tags: [instseg, iggt]

logger: tensorboard

data_loader:
  train:
    batch_size: 1

model:
  encoder:
    pretrained_weights: "/mnt/shared-storage-gpfs2/solution-gpfs02/liaoyuanjun/iggt_checkpoint.pth"
    instance_feat_dim: 8
    intermediate_layer_idx: [4, 11, 17, 23]
  decoder: null

optimizer:
  lr: 3.0e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  freeze_keywords: [aggregator, camera_head]
  param_groups:
    - keywords: [part_adaptor, part_head]
      lr_multiplier: 1.0
    - keywords: [point_head, depth_head]
      lr_multiplier: 0.1

trainer:
  max_steps: 60000
  val_check_interval: 500
  precision: bf16-mixed
  limit_val_batches: 1

checkpointing:
  load: null
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 3

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  disc:
    weight: 1.0
    delta_v: 0.5
    delta_d: 1.0
    ignore_id: 0

dataset:
  manifest: {}
