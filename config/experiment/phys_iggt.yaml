# @package _global_
# IGGT physics property classification on a manifest dataset.
# Usage: python src/main.py +experiment=phys_iggt
#
# Scheme = physics_parser + phys head cfg + phys loss yaml (this file).

defaults:
  - /dataset@_group_.manifest: manifest
  - override /model/encoder: iggt
  - override /loss: [phys]

wandb:
  name: phys_iggt
  tags: [physics, iggt]

logger: tensorboard

data_loader:
  train:
    batch_size: 1

model:
  encoder:
    pretrained_weights: "/mnt/shared-storage-gpfs2/solution-gpfs02/liaoyuanjun/iggt_checkpoint.pth"
    instance_feat_dim: 8
    intermediate_layer_idx: [4, 11, 17, 23]
    phys_head_enabled: true
    phys_feat_dim: 32
    phys_num_classes: 4
    phys_classifier_hidden: 64
    phys_class_names: [static, rigid, soft, unknown]
    phys_use_point_feat: true
    phys_use_window_cross_attn: true
  decoder: null

optimizer:
  lr: 3.0e-5
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  freeze_keywords: [aggregator, camera_head]
  param_groups:
    - keywords: [part_adaptor, part_head]
      lr_multiplier: 0.0
    - keywords: [physics_head, physics_classifier]
      lr_multiplier: 1.0
    - keywords: [point_head, depth_head]
      lr_multiplier: 0.1

trainer:
  max_steps: 60000
  val_check_interval: 500
  precision: bf16-mixed
  limit_val_batches: 1

checkpointing:
  load: null
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 3

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  phys:
    weight: 1.0
    num_classes: 4
    ignore_id: 0
    focal_gamma: 2.0
    dense_aux_weight: 0.0

dataset:
  manifest:
    root: 3dovs/bench
    manifest_path: manifest.jsonl
    original_image_shape: [756, 1008]
    physics_parser: 3dovs_json
