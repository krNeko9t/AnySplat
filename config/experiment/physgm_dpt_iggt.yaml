# @package _global_
# PhysGM supervision + DPT physics head (scheme physgm_dpt).
# Usage: python src/main.py +experiment=physgm_dpt_iggt
#
# Same z-scored targets / NLL+MSE loss as physgm_iggt, but the per-instance
# feature comes from a dense DPT PhysicsHead at image resolution (capacity)
# pooled with the full-resolution instance mask, instead of pooling raw
# frozen aggregator patch tokens.
#
# lr follows PhysGM's decoder training (configs/train.yaml: lr=2e-4, cosine,
# weight_decay=0.05) — everything except physics_scheme is frozen, so the
# base lr applies to the physics path only.

defaults:
  - /dataset@_group_.manifest: manifest
  - override /model/encoder: iggt
  - override /loss: [physgm]

wandb:
  name: physgm_dpt_iggt
  tags: [physics, physgm, dpt, iggt]

logger: tensorboard

data_loader:
  train:
    batch_size: 1

model:
  encoder:
    pretrained_weights: "/home/liaoyuanjun/iggt_checkpoint.pth"
    instance_feat_dim: 8
    intermediate_layer_idx: [4, 11, 17, 23]
    phys_scheme: physgm_dpt
    phys_feat_dim: 32
    physgm_hidden: 64
    phys_use_point_feat: true
    phys_use_window_cross_attn: true
  decoder: null

optimizer:
  lr: 2.0e-4
  warm_up_steps: 1000
  backbone_lr_multiplier: 0.1
  # Ticket 02 (iggt-phys-pipeline): "everything except physics_scheme", written
  # as glob + `!` negation (last match wins -- base_wrapper.apply_freeze).
  # Measured equivalent to the old enumeration it replaces (*aggregator* /
  # *camera_head* / *point_head* / *depth_head* / *part_adaptor* / *part_head*):
  # regenerating the lock moved zero requires_grad rows, because those six
  # prefixes happen to cover all 1595 non-physics params this arch builds.  The
  # point of the rewrite is that it *stays* true -- an enumeration silently
  # starts training any module added later, a frozen probe cannot afford that.
  # 1729 params total, 134 trainable, all under physics_scheme.
  freeze_keywords: ["*", "!*physics_scheme*"]
  param_groups:
    - keywords: [physics_scheme]
      lr_multiplier: 1.0

trainer:
  # 10k, not 60k: this is a frozen probe -- only physics_scheme has gradients --
  # and phys-on-query saw the physics metrics bottom out around 5-10k.  10k
  # leaves room for one full re-run inside the two-day window.
  max_steps: 10000
  val_check_interval: 500
  precision: bf16-mixed
  limit_val_batches: 1

checkpointing:
  load: null
  every_n_train_steps: 500
  save_weights_only: false
  save_top_k: 3

hydra:
  run:
    # NOT under the repo: `/` is a 439G disk sitting at 96% (21G free), and a
    # full checkpoint here is multi-GB.  A previous run filled the root disk and
    # killed a job with OSError 28.  /mnt/storage_pool is the 3.5T array the
    # dataset already lives on.
    dir: /mnt/storage_pool/liaoyuanjun/runs/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  physgm:
    weight: 1.0
    mse_weight: 1.0

dataset:
  manifest:
    # Infinigen physics corpus (map G6), copied from phys_query_arm_b_lora.yaml:
    # 1466 manifest rows -> 1387 train / 74 val scenes by generation shard.
    # PHYSGM_NORMALIZATION (src/dataset/physics/parsers.py:74) is already fitted
    # on THIS corpus's train split -- do not point this block elsewhere without
    # refitting it.
    root: /mnt/storage_pool/liaoyuanjun/data/InsScene-15K
    manifest_path: manifest_infinigen_phys.jsonl
    scene_split_path: config/experiment/splits/infinigen_phys_split.json
    original_image_shape: [288, 512]
    input_image_shape: [252, 448]
    physics_parser: instascene_vlm_physgm
    fixed_views_and_shape: true
    view_sampler:
      num_context_views: 4
      num_target_views: 0   # IGGT: all supervised frames in context only
      max_img_per_gpu: 8
