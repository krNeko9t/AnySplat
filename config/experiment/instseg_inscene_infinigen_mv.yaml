# @package _global_
# InstSeg 在 InsScene-processed_infinigen 子集上多卡训练。
# 先运行 scripts/extract_and_make_manifest_insscene.py 解压并生成 manifest，
# 再本实验用 dataset.manifest.root / manifest_path 指向解压目录和 manifest。
# 多卡：CUDA_VISIBLE_DEVICES=0,1,2,3 python src/main.py -m experiment=instseg_inscene_infinigen_mv

defaults:
  - instseg_anysplat

logger: tensorboard

train:
  video_use_gt_trajectory: true  # val 视频固定轨迹，便于对比训练进度

wandb:
  name: instseg_inscene_infinigen
  tags: [instseg, inscene, infinigen]

# 解压后的根目录与 manifest（请先跑 extract_and_make_manifest_insscene.py）
dataset:
  manifest:
    root: /mnt/shared-storage-gpfs2/solution-gpfs02/liaoyuanjun/dataset/InsScene-15K/processed_infinigen_extracted
    manifest_path: /mnt/shared-storage-gpfs2/solution-gpfs02/liaoyuanjun/dataset/InsScene-15K/processed_infinigen_extracted/manifest.jsonl

# 多卡时适当增加 num_workers
data_loader:
  train:
    num_workers: 8
    batch_size: 8

optimizer:
  # Differential LRs:
  # - instance head: lr
  # - everything else: lr * backbone_lr_multiplier
  lr: 2.0e-4
  warm_up_steps: 3000

trainer:
  max_steps: 60000
  val_check_interval: 500

loss:
  disc:
    weight: 1.0
    delta_v: 0.5          # 可调小到 0.2
    delta_d: 1.5          # 可调大到 2.5
    ignore_id: 0
    # --- 多视角与 soft 开关（可配合 step 做 curriculum）---
    multi_view: true
    multi_view_step: 15000   # 第 N 步才启用 multi_view，0 表示从 step 0 就用
    alpha_var: 1.0
    alpha_dist: 2.0
    # soft_push_weight: 0.5
    # soft_pull_weight: 0.1
    # soft_step: 20000       # 第 M 步开始把 soft 从 0 线性加到目标值
    # soft_ramp_steps: 5000   # ramp 持续步数

