# @package _global_
# Stage 1: adapt the official SegVGGT checkpoint to CLASS-AGNOSTIC instance
# segmentation on this repo's manifest datasets (multi-view-consistent instance
# ids, no semantic labels).  "IGGT end-to-end, minus the background."
# Usage: python src/main.py +experiment=segvggt_finetune_agnostic
#
# Why this is cheap: the loss marginalises the pretrained classifier into
# objectness, P(object) = 1 - P(no-match) -- no head surgery, no channel is
# repurposed, the checkpoint's weights are used as they are.
# This is NOT the same as the checkpoint already being class-agnostic at init:
# ScanNet trained unannotated objects *as background*, so at init
# `1 - P(no-match)` means "is this one of the 18 ScanNet instance classes", not
# "is this any object at all". Marginalising only gives fine-tuning a sane
# starting point; teaching "any object" is exactly what this stage has to do, and
# the initial loss is not expected to be low. Do not use it as an acceptance test.
# Only the instance branch has to adapt, so the whole aggregator (DINO, frame /
# global blocks incl. their pretrained LoRA) and the geometry heads stay frozen.
# Geometry therefore cannot drift and `segvggt_geo` is switched off.
#
# For the full paper recipe (LoRA + geometry co-training) use
# experiment=segvggt_scannet instead.

defaults:
  - /dataset@_group_.manifest: manifest
  - override /model/encoder: segvggt
  - override /loss: [segvggt, segvggt_geo]

wandb:
  name: segvggt_finetune_agnostic
  tags: [instseg, segvggt, class_agnostic, finetune]

logger: tensorboard

data_loader:
  train:
    batch_size: 1

model:
  encoder:
    # use_lora must stay true -- the checkpoint carries trained LoRA weights.
    #
    # num_semantic_classes MUST match the checkpoint's head: width =
    # (num_semantic_classes - len(non_instance_classes)) + 1.  `_align_state_dict`
    # drops shape-mismatched tensors with only a warning (strict=False; the sole
    # hard assert covers query_physgm), so a wrong count here silently leaves the
    # objectness classifier at random init -- which is exactly the weight this
    # stage's `class_agnostic` marginalisation is built to reuse.  Checkpoint and
    # count are pinned together in this file so they cannot drift apart.
    pretrained_weights: /mnt/storage_pool/liaoyuanjun/hf_home/hub/models--JinyuanQu--SegVGGT/snapshots/5a7818348c1f4978db4a8be904f180575fc2322a/checkpoint/segvggt_scannet200.pt
    num_semantic_classes: 200
    non_instance_classes: [wall, floor]  # 200 - 2 + 1 = 199-wide instance head
    instance_query_num: 400
  decoder: null

optimizer:
  # Nothing is randomly initialised here (we are adapting, not training from
  # scratch), so the paper's 2e-4 group would be far too hot -- single LR.
  lr: 2.0e-5
  warm_up_steps: 200
  backbone_lr_multiplier: 1.0
  # Freeze aggregator (DINO + frame/global incl. pretrained LoRA) + geometry
  # heads + bare camera/register tokens; semantic_head / instance_ are what this
  # stage adapts.
  freeze_keywords:
    - patch_embed
    - frame_blocks
    - global_blocks
    - camera_head
    - depth_head
    - camera_token
    - register_token
train:
  segvggt_geo_supervision: gt

trainer:
  max_steps: 10000
  val_check_interval: 250
  precision: bf16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 4

checkpointing:
  load: null
  every_n_train_steps: 1000
  save_weights_only: false
  save_top_k: 1

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  segvggt:
    weight: 1.0
    class_agnostic: true
  segvggt_geo:
    weight: 0.0   # geometry is frozen in this stage; flip on only if unfreezing

dataset:
  manifest:
    # Spelled out in full rather than inherited: config/dataset/manifest.yaml
    # defaults to an infinigen scene at 288x512 with bounded_fixed's 12 context
    # views, none of which this stage wants, and every one of those falls back
    # silently.  Same scannet100 subset as stage 2 (segvggt_physgm) so the two
    # stages see the same scenes.  physics_parser stays null -- segmentation only.
    root: /mnt/storage_pool/liaoyuanjun/data/InsScene-15K/processed_scannetpp_v2
    manifest_path: /home/liaoyuanjun/projects/AnySplat/manifests/manifest_phys_scannet100.jsonl
    original_image_shape: [690, 920]
    input_image_shape: [252, 448]
    view_sampler:
      num_context_views: 4
      num_target_views: 0   # SegVGGT: all supervised frames in context only
      max_img_per_gpu: 8
