# @package _global_

defaults:
  - /dataset@_group_.custom: custom
  - override /model/encoder: anysplat
  - override /model/encoder/backbone: croco
  - override /model/decoder: splatting_cuda
  - override /loss: [mse, lpips, depth_consis, mvc]

wandb:
  name: instseg_custom
  tags: [instseg, custom]

data_loader:
  # Avoid having to spin up new processes to print out visualizations.
  train:
    batch_size: 1

model:
  encoder:
    instance_feat_dim: 32
    pred_head_type: depth
    pred_pose: true
    distill: true
    voxelize: true
    intermediate_layer_idx: [4, 11, 17, 23]

trainer:
  max_steps: 30000
  val_check_interval: 500
  precision: bf16-mixed
  # 若验证阶段卡在“Validation epoch start”后，可设为 1 仅跑 1 个 val batch 以确认是否为首批 I/O 过慢
  limit_val_batches: 1

checkpointing:
  load: null
  every_n_train_steps: 200
  save_weights_only: false
  save_top_k: 5

hydra:
  run:
    dir: output/exp_${wandb.name}/${now:%Y-%m-%d_%H-%M-%S}

loss:
  mvc:
    weight: 1.0
    num_samples: 4096
    margin: 1.0
    lambda_pull: 2.0
    lambda_push: 1.0
    ignore_id: 0
    block_size: 512
    normalize_by_pairs: false

dataset:
  custom: {}

